name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest tests/ -q

      # Секрет в истории git — навсегда, даже если удалить файл потом.
      # Дешевле поймать в PR, чем перевыпускать все ключи.
      - name: Секреты не в индексе
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env попал в репозиторий"
            exit 1
          fi
          if git grep -nE '(secret|password|token)\s*=\s*["'"'"'][A-Za-z0-9/+_-]{16,}' \
               -- '*.py' '*.yml' '*.sh'; then
            echo "::error::похоже на захардкоженный секрет"
            exit 1
          fi
          echo "секретов не найдено"

      # Данные по вакансиям не публикуются (условия API hh, docs/sources/hh.md §5).
      # Репозиторий публичный: файл выгрузки в нём уже публикация.
      - name: Данные по вакансиям не в индексе
        run: |
          if git ls-files | grep -E '(^|/)public/data/|vacancies\.json$|events\.json$|employers\.json$'; then
            echo "::error::в репозиторий попала выгрузка данных по вакансиям"
            exit 1
          fi
          echo "выгрузки в индексе нет"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка
        run: npm ci

      - name: Типы
        run: npx tsc --noEmit

      # Квантили и правила профессий сверяются с эталонами из Python:
      # если реализации разойдутся, медианы на сайте перестанут совпадать с данными
      - name: Тесты
        run: npx vitest run
