services:
  minio:
    image: minio/minio:latest
    container_name: talap-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?не задан в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?не задан в .env}
    ports:
      # Порты настраиваются: на сервере 9000/9001 уже занимает MinIO
      # другого проекта (kiri-minio). Значения — в .env.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # без mc и curl: проверяем, что порт отвечает
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: talap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-talap}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?не задан в .env}
      POSTGRES_DB: ${PG_DATABASE:-talap}
    ports:
      # На сервере 5432 уже занят постгресами других проектов
      - "127.0.0.1:${PG_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-talap} -d ${PG_DATABASE:-talap}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
