[project]
name = "talap-ingestion"
version = "0.1.0"
description = "Talap — сбор сырых данных о вакансиях"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

# Без явного списка setuptools не может выбрать между ingestion, enrichment и dbt
# и отказывается собирать. dbt — не python-пакет, это проект dbt.
[tool.setuptools.packages.find]
include = ["ingestion*", "enrichment*"]

[tool.setuptools.package-data]
ingestion = ["sql/*.sql"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
